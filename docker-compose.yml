services:
  postgres:
    image: postgres:16-alpine
    container_name: rib-postgres
    environment:
      POSTGRES_USER: ripple
      POSTGRES_PASSWORD: ripple
      POSTGRES_DB: rib
    ports:
      - "5432:5432"
    volumes:
      - rib_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ripple -d rib"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rib_pg_data:
